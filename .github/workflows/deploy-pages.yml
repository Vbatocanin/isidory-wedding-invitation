name: Deploy to GitHub Pages

# Publishes the site to the repo's project Pages URL:
#   https://vbatocanin.github.io/isidory-wedding-invitation/
# This is separate from your user site (vbatocanin.github.io), so it does
# not affect your CV.
#
# ONE-TIME SETUP: in the repo, go to Settings → Pages → "Build and
# deployment" → Source → select "GitHub Actions". After that, every push
# to main publishes automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the static site.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
