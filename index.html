<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isidora &amp; Nebojša — Pozivnica</title>
  <meta name="description" content="Pozivnica na venčanje — Isidora i Nebojša, 04.10.2026." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>

  <!-- Fixed, non-scrollable stage. The page never scrolls; the first scroll
       gesture plays the whole reveal animation (see script.js), so there is
       nothing to overscroll. -->
  <div id="scroller">

  <!-- Photo gallery — first screen; all visuals are position:fixed -->
  <div id="gallery-screen">
    <div class="photo-item" id="photo-0">
      <img src="assets/images/IMG_4071.webp" alt="" />
    </div>
    <div class="photo-item" id="photo-1">
      <img src="assets/images/IMG_3936 2.webp" alt="" />
    </div>
    <div class="photo-item" id="photo-2">
      <img src="assets/images/0ac86ce3-7c8e-48cb-ba48-e50557eb331c 2.webp" alt="" />
    </div>
    <div class="photo-item" id="photo-3">
      <img src="assets/images/6218f7a4-5ffc-48e7-8cbd-07a503e00d68 2.webp" alt="" />
    </div>

    <button id="scroll-hint" type="button" aria-label="Skrolujte nadole">
      <span class="scroll-hint-text">Skrolujte nadole</span>
      <div class="scroll-chevron-wrap">
        <svg class="scroll-chevron" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L12 12L23 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>
  </div>

  <!-- Invitation panel — zooms in from the centre as user scrolls -->
  <div id="invitation-panel" aria-hidden="true">
    <main id="invitation">
      <p class="date">04.10.2026.</p>
      <h1 class="names">Isidora<br /><span class="amp">&amp;</span><br />Nebojša</h1>
      <section class="schedule">
        <p><span class="time">14h</span> Crkveno venčanje u Crkvi Svete Trojice, Ripanj</p>
        <p><span class="time">16h</span> Okupljanje gostiju, Restoran Easy, Beograd</p>
        <p><span class="time">16.30h</span> Venčanje</p>
      </section>
      <p class="rsvp-note">
        Molimo vas da svoj dolazak potvrdite do 20. septembra 2026. godine.
      </p>
      <a id="rsvp-button" class="rsvp-button"
         href="https://forms.gle/rJuRy1pQHEXEaRydA"
         target="_blank" rel="noopener">Potvrdite dolazak</a>
    </main>

    <button id="music-toggle" class="music-toggle" aria-label="Pusti muziku" hidden>
      <span class="music-icon" aria-hidden="true"></span>
    </button>
  </div>

  </div><!-- /#scroller -->

  <audio id="song" src="assets/felicita.mp3" loop preload="auto"></audio>
  <script src="script.js?v=8"></script>
</body>
</html>
