<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <meta name="description" content="You are warmly invited to our wedding." />

  <!-- Elegant serif + script pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    ============================================================
    HOW TO CUSTOMISE
    ============================================================
    1. PHOTO  → replace assets/hero.jpg with your own photo.
    2. SONG   → drop the "Felicità" mp3 in at assets/felicita.mp3
                (see assets/README.md for details).
    3. TEXT   → edit the names / date / location below.
    ============================================================
  -->

  <!-- Entry overlay: a tap is required so the song is allowed to play -->
  <div id="enter-screen" class="enter-screen">
    <div class="enter-inner">
      <p class="enter-kicker">You are invited</p>
      <h1 class="enter-names">Isidora &amp; Vlad</h1>
      <p class="enter-hint">Tap to open the invitation</p>
      <span class="enter-note">♪ with music</span>
    </div>
  </div>

  <!-- The page itself: a full-bleed hero photo -->
  <main id="invitation" class="invitation" aria-hidden="true">
    <header class="page-header">
      <span class="header-names">Isidora &amp; Vlad</span>
    </header>

    <!-- The photo IS the page. Swap assets/hero.jpg for your own. -->
    <figure class="hero">
      <img
        src="assets/hero.jpg"
        alt="The happy couple"
        class="hero-img"
        onerror="this.onerror=null;this.src='assets/hero-placeholder.svg';"
      />
    </figure>

    <footer class="page-footer">
      <span class="footer-date">Saturday, the 12th of September 2026</span>
      <span class="footer-sep">·</span>
      <span class="footer-place">Belgrade, Serbia</span>
    </footer>
  </main>

  <!-- Floating music toggle (appears after entering) -->
  <button id="music-toggle" class="music-toggle" aria-label="Pause music" hidden>
    <span class="music-icon" aria-hidden="true"></span>
  </button>

  <!-- The song. Add assets/felicita.mp3 — see assets/README.md -->
  <audio id="song" src="assets/felicita.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
